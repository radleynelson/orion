name: OrionMobile
options:
  bundleIdPrefix: com.orion
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  SwiftTerm:
    path: Vendor/SwiftTerm

targets:
  OrionMobile:
    type: application
    platform: iOS
    sources:
      - OrionMobile
    settings:
      base:
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]": com.orion.mobile.simulator
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphoneos*]": com.orion.mobile.$(DEVELOPMENT_TEAM)
        INFOPLIST_FILE: OrionMobile/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_ENTITLEMENTS: OrionMobile/OrionMobile.entitlements
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
